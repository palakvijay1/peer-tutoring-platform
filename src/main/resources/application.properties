spring.application.name=peer-tutoring-platform

# ── Database: H2 file-based (data persists across restarts) ──────────────────
# FIX: Changed from jdbc:h2:mem (in-memory, data lost on restart)
#      to jdbc:h2:file (file-based, data persists)
spring.datasource.url=jdbc:h2:file:./data/peertutoring
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

server.port=8082

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── H2 Console (browser at http://localhost:8082/h2-console) ─────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Disable Spring Security (demo mode, no JWT enforcement) ──────────────────
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
